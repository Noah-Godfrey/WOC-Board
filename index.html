        const inp = sh.el.querySelector('#cp-q');
        inp.addEventListener('input', () => { st.q = inp.value; sh.el.querySelector('#cp-list').innerHTML = rows(); });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });
      },
      acts: {
        pick: (el, sh) => { const id = el.dataset.id; closeSheet(sh); onPick(id); },
        new: (el, sh) => openContractorForm({ prefillName: st.q.trim(), onSaved: (c) => { closeSheet(sh); onPick(c.id); } }),
      },
    });
  }

  function openContractorForm({ contractor, prefillName, onSaved }) {
    const isNew = !contractor;
    const v = contractor || { name: prefillName || '', email: '', phone: '', notes: '' };
    openSheet({
      kind: 'page',
      cls: 'form-sheet',
      title: isNew ? 'New Contractor' : 'Edit Contractor',
      focus: '#cf-name',
      render: () => {
        const used = isNew ? 0 : db.cards.filter((c) => c.contractorId === contractor.id).length;
        return `<form class="form" novalidate>
          <div class="field"><label for="cf-name">Contractor Name</label><input id="cf-name" autocomplete="organization" autocapitalize="words" enterkeyhint="next" value="${esc(v.name)}"></div>
          <div class="field"><label for="cf-email">Email</label><input id="cf-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" value="${esc(v.email)}"></div>
          <div class="field"><label for="cf-phone">Phone #</label><input id="cf-phone" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="next" value="${esc(v.phone)}"></div>
          <div class="field"><label for="cf-notes">Notes</label><textarea id="cf-notes" rows="4">${esc(v.notes)}</textarea></div>
          <p class="err" id="cf-err" hidden></p>
          <div class="form-actions"><button type="button" class="btn btn-quiet" data-sact="close">Cancel</button><button type="submit" class="btn btn-primary">${isNew ? 'Add Contractor' : 'Save Changes'}</button></div>
          ${isNew ? '' : `<div class="dt-tools"><span class="muted">${used ? `Assigned to ${plural(used, 'work order', 'work orders')}.` : 'Not assigned to any work orders.'}</span><button type="button" class="btn btn-quiet danger-text" data-sact="delete"${used ? ' disabled' : ''}>${ICON.trash}<span>Delete</span></button></div>`}
        </form>`;
      },
      onSubmit: (form, sh) => {
        const $ = (s) => sh.el.querySelector(s);
        const name = $('#cf-name').value.trim();
        const email = $('#cf-email').value.trim();
        const phone = $('#cf-phone').value.trim();
        const notes = $('#cf-notes').value.trim();
        const err = $('#cf-err');
        const fail = (msg, sel) => { err.textContent = msg; err.hidden = false; $(sel).focus(); };
        if (!name) return fail('Enter the contractor’s name.', '#cf-name');
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('That email doesn’t look complete. Check it for typos.', '#cf-email');
        const dup = db.contractors.find((c) => norm(c.name) === norm(name) && (isNew || c.id !== contractor.id));
        if (dup) return fail(`${dup.name} is already in your contractor list.`, '#cf-name');
        let saved;
        if (isNew) {
          saved = { id: uid(), name, email, phone, notes, createdAt: Date.now(), sample: false };
          db.contractors.push(saved);
        } else {
          saved = conById(contractor.id);
          if (saved) Object.assign(saved, { name, email, phone, notes, sample: false });
        }
        save();
        closeSheet(sh);
        if (onSaved && saved) onSaved(saved);
        else { render(); showToast(isNew ? `Added ${name}` : 'Contractor saved'); }
      },
      acts: {
        delete: async (el, sh) => {
          const ok = await confirmDialog({ title: 'Delete this contractor?', message: `<p><b>${esc(contractor.name)}</b> will be removed from your contractor list.</p>`, confirm: 'Delete', danger: true });
          if (!ok) return;
          db.contractors = db.contractors.filter((c) => c.id !== contractor.id);
          closeSheet(sh);
          commit();
          showToast('Contractor deleted');
        },
      },
    });
  }

  function openContractorList() {
    const st = { q: '' };
    const rows = () => {
      if (!db.contractors.length) return '<li class="pick-empty">No contractors yet. They’re added here or when you move a card into S2.</li>';
      const q = norm(st.q);
      const list = sortedContractors().filter((c) => !q || norm(c.name).includes(q) || norm(c.notes).includes(q) || norm(c.phone).includes(q) || norm(c.email).includes(q));
      if (!list.length) return `<li class="pick-empty">No contractors match “${esc(st.q.trim())}”.</li>`;
      return list.map((c) => `<li><button type="button" class="pick-row" data-sact="edit" data-id="${esc(c.id)}"><span class="pick-name">${esc(c.name)}<span class="pick-sub">${esc([c.phone, c.email].filter(Boolean).join(' · ') || 'No phone or email on file')}</span></span><span class="pick-meta">${openCountFor(c.id)} open</span>${ICON.right}</button></li>`).join('');
    };
    openSheet({
      kind: 'page',
      cls: 'picker',
      title: 'Manage Contractors',
      live: true,
      render: () => `<div class="picker-tools">
          <label class="search-box"><span class="sr-only">Search contractors</span>${ICON.search}<input id="cl-q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search contractors" value="${esc(st.q)}"></label>
          <button type="button" class="btn btn-ghost btn-wide" data-sact="new">${ICON.plus}<span>New Contractor</span></button>
        </div>
        <ul class="pick-list" id="cl-list">${rows()}</ul>`,
      afterRender: (sh) => {
        const inp = sh.el.querySelector('#cl-q');
        inp.addEventListener('input', () => { st.q = inp.value; sh.el.querySelector('#cl-list').innerHTML = rows(); });
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });
      },
      acts: {
        new: () => openContractorForm({}),
        edit: (el) => { const c = conById(el.dataset.id); if (c) openContractorForm({ contractor: c }); },
      },
    });
  }

  // ---------- Stage menu ----------
  function openStageMenu() {
    openSheet({
      kind: 'menu',
      cls: 'stage-menu',
      title: 'Go to',
      render: () => {
        const counts = stageCounts();
        return `<ul class="menu-list">${STAGES.map((s, i) => `<li><button type="button" class="menu-row${i === ui.tab ? ' on' : ''}" data-sact="go" data-tab="${i}" style="${scv(i)}"${i === ui.tab ? ' aria-current="page"' : ''}>
            <span class="chip">${i === 0 ? ICON.grid : 'S' + i}</span>
            <span class="menu-names"><span class="menu-short">${esc(i === 0 ? 'Overview' : s.short)}</span>${i ? `<span class="menu-full">${esc(s.full)}</span>` : '<span class="menu-full">Search, follow-ups, and stats</span>'}</span>
            <span class="menu-nums">${counts.due[i] ? `<span class="menu-due">${counts.due[i]} due</span>` : ''}<span class="menu-count">${counts.total[i]}</span></span>
          </button></li>`).join('')}</ul>`;
      },
      acts: { go: (el, sh) => { const t = +el.dataset.tab; closeSheet(sh); goTab(t); } },
    });
  }

  // ---------- Settings, backups, maintenance ----------
  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function saveFile(text, name) {
    const blob = new Blob([text], { type: 'application/json' });
    if (isIOS() && navigator.canShare && typeof File === 'function') {
      try {
        const file = new File([blob], name, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: name }).then(() => 'shared', (e) => (e && e.name === 'AbortError' ? 'cancelled' : download()));
        }
      } catch (e) { /* fall through to a download */ }
    }
    return Promise.resolve(download());
    function download() {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return 'downloaded';
    }
  }

  function createBackup() {
    if (BUILD === 'preview') {
      showToast('This preview can’t save files. Backups work in the GitHub Pages version.');
      return;
    }
    const now = Date.now();
    evaluateAR(now);
    const payload = { app: 'woc-board', version: 1, exportedAt: new Date(now).toISOString(), data: { cards: db.cards, contractors: db.contractors, lastEval: db.lastEval } };
    const name = `woc-backup-${stamp(now)}.json`;
    saveFile(JSON.stringify(payload, null, 2), name).then((result) => {
      if (result === 'cancelled') return;
      db.lastBackupAt = now;
      save();
      render();
      showToast(result === 'shared' ? 'Backup file ready' : `Backup saved as ${name}`);
    });
  }

  function restoreFromFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => showToast('Couldn’t read that file.');
    reader.onload = async () => {
      let parsed = null;
      try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
      const looksRight = parsed && typeof parsed === 'object' && (parsed.app === 'woc-board' || (parsed.data && Array.isArray(parsed.data.cards)) || Array.isArray(parsed.cards));
      if (!looksRight) { showToast('That file isn’t a WOC Board backup.'); return; }
      const next = normalizeDb(parsed);
      const when = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? fmtDT(Date.parse(parsed.exportedAt)) : 'an unknown date';
      const ok = await confirmDialog({
        title: 'Load this backup?',
        message: `<p>The backup from <b>${esc(when)}</b> has ${plural(next.cards.length, 'work order', 'work orders')} and ${plural(next.contractors.length, 'contractor', 'contractors')}.</p><p>Loading it replaces everything on this device right now (${plural(db.cards.length, 'work order', 'work orders')}, ${plural(db.contractors.length, 'contractor', 'contractors')}).</p>`,
        confirm: 'Replace with Backup',
        danger: true,
      });
      if (!ok) return;
      const prev = db;
      next.lastBackupAt = prev.lastBackupAt;
      db = next;
      commit();
      showToast('Backup loaded', () => { db = prev; commit(); showToast('Back to the data you had before'); });
    };
    reader.readAsText(file);
  }

  async function eomWipe() {
    const n = db.cards.filter((c) => c.stage === LAST).length;
    if (!n) { showToast('S11 Work Order Closed is already empty.'); return; }
    const ok = await confirmDialog({
      title: 'EOM Completion Wipe',
      message: `<p>Remove the ${plural(n, 'work order', 'work orders')} in <b>S11 Work Order Closed</b>?</p><p>Nothing else in the app changes.</p>`,
      confirm: `Remove ${n}`,
      danger: true,
    });
    if (!ok) return;
    db.cards = db.cards.filter((c) => c.stage !== LAST);
    commit();
    showToast(`Removed ${plural(n, 'closed work order', 'closed work orders')}`);
  }

  async function resetAll() {
    const n = db.cards.length;
    if (!n) { showToast('There are no work orders to delete.'); return; }
    const first = await confirmDialog({
      title: 'Reset all data?',
      message: `<p>This deletes all ${plural(n, 'work order', 'work orders')} in every stage. Your contractor list stays.</p>`,
      confirm: 'Continue',
      danger: true,
    });
    if (!first) return;
    const second = await confirmDialog({
      title: 'Are you sure?',
      message: '<p>There’s no undo. If you might need these work orders later, cancel and create a backup first.</p>',
      confirm: 'Delete Everything',
      danger: true,
    });
    if (!second) return;
    db.cards = [];
    commit();
    showToast('All work orders deleted');
  }

  function openSettings() {
    openSheet({
      kind: 'page',
      cls: 'settings',
      title: 'Settings',
      live: true,
      render: () => {
        const now = Date.now();
        const s11 = db.cards.filter((c) => c.stage === LAST).length;
        return `<div class="set-list">
            <button type="button" class="set-row" data-sact="contractors">${ICON.users}<span class="set-main"><span class="set-title">Manage Contractors</span><span class="set-sub">${plural(db.contractors.length, 'contractor', 'contractors')}</span></span>${ICON.right}</button>
            <button type="button" class="set-row" data-sact="backup">${ICON.download}<span class="set-main"><span class="set-title">Create Backup</span><span class="set-sub">Last backup: ${esc(lastBackupText(now))}</span></span></button>
            <button type="button" class="set-row" data-sact="restore">${ICON.upload}<span class="set-main"><span class="set-title">Load Backup</span><span class="set-sub">Replace this board with a saved backup file</span></span></button>
          </div>
          <h3 class="set-head">Maintenance</h3>
          <div class="set-list">
            <button type="button" class="set-row" data-sact="eom">${ICON.archive}<span class="set-main"><span class="set-title">EOM Completion Wipe</span><span class="set-sub">${s11 ? `Removes the ${plural(s11, 'work order', 'work orders')} in S11 Work Order Closed. Nothing else changes.` : 'S11 Work Order Closed is empty.'}</span></span></button>
          </div>
          <div class="set-gap"></div>
          <div class="set-list">
            <button type="button" class="set-row danger" data-sact="reset">${ICON.trash}<span class="set-main"><span class="set-title">Reset All Data</span><span class="set-sub">Deletes every work order in every stage. Contractors stay.</span></span></button>
          </div>
          <input type="file" id="restore-file" class="sr-only" accept=".json,application/json" tabindex="-1" aria-hidden="true">
          <p class="set-foot">Your board is saved in this browser on this device only. Create a backup regularly and keep the file somewhere safe, like iCloud Drive or Google Drive.</p>`;
      },
      afterRender: (sh) => {
        const inp = sh.el.querySelector('#restore-file');
        inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.value = ''; restoreFromFile(f); });
      },
      acts: {
        contractors: () => openContractorList(),
        backup: () => createBackup(),
        restore: (el, sh) => sh.el.querySelector('#restore-file').click(),
        eom: () => eomWipe(),
        reset: () => resetAll(),
      },
    });
  }

  // ---------- Sample data ----------
  function loadSamples() {
    const now = Date.now();
    evaluateAR(now);
    const ymd = (days, h, m) => { const d = new Date(now); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + days, h, m || 0).getTime(); };
    const past = (days, h, m) => Math.min(ymd(days, h, m), now - 6e4);
    const L = latest8am(now);
    const fuToday = Math.max(L, Math.min(now - 6e4, L + 50 * 6e4));
    const cons = {
      prairie: ['Prairie Mechanical', 'dispatch@prairiemech.example', '(785) 555-0142', 'HVAC and refrigeration. Text first, then call.'],
      heartland: ['Heartland Door & Glass', 'service@heartlanddoor.example', '(316) 555-0178', 'Storefront doors, glass, and closers. Needs a PO before quoting.'],
      sunflower: ['Sunflower Electric', 'office@sunflowerelectric.example', '(913) 555-0113', 'Lighting and panels. After-hours rate applies after 6pm.'],
      flint: ['Flint Hills Plumbing', 'jobs@flinthillsplumbing.example', '(620) 555-0190', 'Water heaters and drains. Usually quotes the same day.'],
      roof: ['Midwest Roof Pros', 'help@midwestroofpros.example', '(402) 555-0155', ''],
    };
    const conIds = {};
    for (const k of Object.keys(cons)) {
      const [name, email, phone, notes] = cons[k];
      const existing = db.contractors.find((c) => norm(c.name) === norm(name));
      if (existing) { conIds[k] = existing.id; continue; }
      const id = uid();
      conIds[k] = id;
      db.contractors.push({ id, name, email, phone, notes, createdAt: now, sample: true });
    }
    const specs = [
      { ref: '4410238', wo: '88123', store: 'DG 12205 Topeka, KS', stage: 1, origin: [0, 7, 40], inStage: 0, state: 'ar', dsf: 0 },
      { ref: '4410251', wo: '88140', store: 'DG 08817 Wichita, KS', stage: 1, origin: [-1, 13, 5], inStage: 1, state: 'ar', dsf: 1 },
      { ref: '4409987', wo: '87990', store: 'DG 15532 Lawrence, KS', stage: 2, origin: [-3, 9, 20], inStage: 2, con: 'heartland', state: 'today' },
      { ref: '4409912', wo: '87931', store: 'DG 11064 Salina, KS', stage: 2, origin: [-4, 11, 45], inStage: 3, con: 'prairie', state: 'ar', dsf: 2 },
      { ref: '4409750', wo: '87802', store: 'DG 09421 Manhattan, KS', stage: 3, origin: [-6, 8, 30], inStage: 2, con: 'sunflower', eta: [0, 13, 0], state: 'ar', dsf: 2 },
      { ref: '4409733', wo: '87790', store: 'DG 13377 Emporia, KS', stage: 3, origin: [-5, 14, 10], inStage: 1, con: 'flint', eta: [3, 9, 30], state: 'yesterday' },
      { ref: '4409501', wo: '87655', store: 'DG 10288 Hutchinson, KS', stage: 4, origin: [-9, 10, 0], inStage: 1, con: 'prairie', eta: [-1, 10, 0], state: 'ar', dsf: 1 },
      { ref: '4409320', wo: '87512', store: 'DG 07734 Junction City, KS', stage: 5, origin: [-14, 15, 30], inStage: 4, con: 'roof', eta: [-5, 11, 0], state: 'ar', dsf: 4 },
      { ref: '4409102', wo: '87390', store: 'DG 14650 Ottawa, KS', stage: 6, origin: [-17, 9, 0], inStage: 2, con: 'heartland', eta: [-8, 9, 0], state: 'today' },
      { ref: '4408890', wo: '87201', store: 'DG 12980 Newton, KS', stage: 7, origin: [-21, 12, 15], inStage: 3, con: 'sunflower', eta: [1, 8, 0], state: 'ar', dsf: 3 },
      { ref: '4408655', wo: '87044', store: 'DG 06612 Leavenworth, KS', stage: 8, origin: [-26, 10, 40], inStage: 2, con: 'flint', state: 'ar', dsf: 2 },
      { ref: '4408411', wo: '86870', store: 'DG 11893 Olathe, KS', stage: 9, origin: [-30, 8, 50], inStage: 1, con: 'prairie', state: 'today' },
      { ref: '4408150', wo: '86702', store: 'DG 09034 Garden City, KS', stage: 10, origin: [-38, 13, 0], inStage: 6, con: 'roof', state: 'ar', dsf: 6 },
      { ref: '4407720', wo: '86311', store: 'DG 15108 Dodge City, KS', stage: 11, origin: [-47, 9, 10], inStage: 2, con: 'heartland', state: 'complete' },
    ];
    for (const s of specs) {
      if (findDup('wo', s.wo)) continue;
      const origin = past(s.origin[0], s.origin[1], s.origin[2]);
      const stageAt = s.stage === 1 ? origin : Math.max(origin + 6e4, past(-s.inStage, 10, 30));
      const history = [];
      for (let k = 1; k <= s.stage; k++) {
        const t = s.stage === 1 ? origin : Math.round(origin + ((stageAt - origin) * (k - 1)) / (s.stage - 1));
        history.push({ stage: k, at: k === s.stage ? stageAt : t });
      }
      const eta = s.eta ? ymd(s.eta[0], s.eta[1], s.eta[2]) : null;
      let ar = true;
      let lastFU = null;
      let dsfFrom = origin;
      if (s.state === 'ar' && s.dsf > 0) { lastFU = Math.max(origin, past(-s.dsf, 15, 10)); dsfFrom = lastFU; }
      if (s.state === 'today') { ar = false; lastFU = fuToday; dsfFrom = fuToday; }
      if (s.state === 'yesterday') { ar = false; lastFU = Math.max(origin, past(-1, 14, 20)); dsfFrom = lastFU; }
      if (s.state === 'complete') { ar = false; lastFU = past(-s.inStage, 9, 40); dsfFrom = lastFU; }
      if (s.stage === 3 && eta != null && L < at8(eta)) ar = false;
      const note = SAMPLE_NOTES[s.wo] || '';
      db.cards.push({ id: uid(), ref: s.ref, wo: s.wo, store: s.store, origin, createdAt: origin, stage: s.stage, stageAt, history, contractorId: s.con ? conIds[s.con] : null, eta, ar, lastFU, dsfFrom, sample: true, note, noteAt: note ? stageAt : null, noteStage: note ? s.stage : null, emergency: SAMPLE_EMERGENCY.has(s.wo) });
    }
    setFlag(NOTES_SEEDED_KEY);
    setFlag(EMER_SEEDED_KEY);
    db.lastEval = now;
    save();
    render();
  }

  function backfillSampleNotes() {
    if (getFlag(NOTES_SEEDED_KEY)) return;
    for (const c of db.cards) {
      if (c.sample && !c.note && SAMPLE_NOTES[c.wo]) { c.note = SAMPLE_NOTES[c.wo]; c.noteAt = c.stageAt; c.noteStage = c.stage; }
    }
    setFlag(NOTES_SEEDED_KEY);
  }
  function backfillSampleEmergency() {
    if (getFlag(EMER_SEEDED_KEY)) return;
    for (const c of db.cards) if (c.sample && SAMPLE_EMERGENCY.has(c.wo)) c.emergency = true;
    setFlag(EMER_SEEDED_KEY);
  }

  function clearSamples() {
    const keep = new Set(db.cards.filter((c) => !c.sample).map((c) => c.contractorId));
    db.cards = db.cards.filter((c) => !c.sample);
    db.contractors = db.contractors.filter((c) => !c.sample || keep.has(c.id));
    commit();
    showToast('Sample work orders cleared');
  }

  function requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist && navigator.storage.persisted) {
        navigator.storage.persisted().then((p) => (p ? null : navigator.storage.persist())).catch(() => {});
      }
    } catch (e) { /* ignore */ }
  }

  // ---------- Global events ----------
  document.addEventListener('click', (e) => {
    if (e.target.closest('.sheet-wrap')) return;
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    switch (el.dataset.act) {
      case 'tab': goTab(+el.dataset.tab); break;
      case 'prev': goTab(ui.tab - 1); break;
      case 'next': goTab(ui.tab + 1); break;
      case 'menu': openStageMenu(); break;
      case 'open-card': openDetail(el.dataset.id); break;
      case 'new-card': openCardForm(); break;
      case 'settings': openSettings(); break;
      case 'load-samples': loadSamples(); showToast('Sample work orders loaded'); break;
      case 'clear-samples': clearSamples(); break;
      case 'toggle-list': ui.expanded = ui.expanded === el.dataset.list ? null : el.dataset.list; render(); break;
      case 'field': {
        ui.field = el.dataset.field;
        savePrefs();
        const root = $main.querySelector('.overview');
        if (root) {
          root.querySelectorAll('.seg-btn').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.field === ui.field)));
          const q = root.querySelector('#ov-q');
          q.placeholder = FIELDS.find((x) => x.k === ui.field).ph;
          updateSearch(Date.now());
        }
        break;
      }
      case 'clear-search': {
        ui.query = '';
        const q = $main.querySelector('#ov-q');
        if (q) { q.value = ''; q.focus(); }
        updateSearch(Date.now());
        break;
      }
      case 'toast-undo': { const fn = toastUndo; hideToast(); if (fn) fn(); break; }
      default: break;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sheetStack.length) { closeSheet(sheetStack[sheetStack.length - 1]); return; }
    const t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t && t.matches && t.matches('article[role="button"][data-act]')) { e.preventDefault(); t.click(); return; }
    const typing = t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
    if (!sheetStack.length && !typing && !e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
      if (e.key === 'ArrowLeft') goTab(ui.tab - 1);
      else if (e.key === 'ArrowRight') goTab(ui.tab + 1);
    }
  });

  // Swipe left or right on the board to change tabs.
  (() => {
    let sx = 0, sy = 0, st = 0, track = false;
    $main.addEventListener('touchstart', (e) => {
      track = false;
      if (sheetStack.length || e.touches.length !== 1) return;
      if (e.target.closest('[data-noswipe], input, textarea')) return;
      const p = e.touches[0];
      if (p.clientX < 24 || p.clientX > window.innerWidth - 24) return;
      sx = p.clientX; sy = p.clientY; st = Date.now(); track = true;
    }, { passive: true });
    $main.addEventListener('touchend', (e) => {
      if (!track) return;
      track = false;
      const p = e.changedTouches[0];
      const dx = p.clientX - sx;
      const dy = p.clientY - sy;
      if (Date.now() - st < 700 && Math.abs(dx) > 80 && Math.abs(dx) > 2.2 * Math.abs(dy)) goTab(ui.tab + (dx < 0 ? 1 : -1));
    }, { passive: true });
  })();

  // ---------- Clock ----------
  let eightTimer = null;
  function scheduleEight() {
    clearTimeout(eightTimer);
    const wait = Math.min(next8am(Date.now()) - Date.now() + 1500, 6 * 36e5);
    eightTimer = setTimeout(() => { tick(); scheduleEight(); }, Math.max(1000, wait));
  }
  function tick(force) {
    const now = Date.now();
    const changed = evaluateAR(now);
    if (changed) save();
    if (changed || force || dayStart(now) !== lastRenderDay) render();
  }

  // ---------- Boot ----------
  function boot() {
    try { if (history.state && history.state.woc) history.replaceState(null, ''); } catch (e) { /* ignore */ }
    const hadData = hasStoredData();
    db = load();
    loadPrefs();
    if (BUILD === 'preview' && !hadData && !getFlag(SEEDED_KEY)) {
      loadSamples();
      setFlag(SEEDED_KEY);
    }
    backfillSampleNotes();
    backfillSampleEmergency();
    evaluateAR(Date.now());
    save();
    render();
    scheduleEight();
    setInterval(tick, 30000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (ui.detail) commitNote(ui.detail); return; }
      tick(true);
      scheduleEight();
    });
    window.addEventListener('focus', () => tick());
    window.addEventListener('pageshow', (e) => { if (e.persisted) tick(true); });
    window.addEventListener('storage', (e) => { if (e.key === KEY) { db = load(); render(); } });
    if (db.cards.length) requestPersist();
    if (BUILD === 'pages' && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
  }

  // Exposed for automated tests only.
  window.__woc = { get db() { return db; }, evaluateAR, sortCards, dsfDays, ageDays, arLabel, latest8am, render, goTab };

  boot();
})();

</script>
